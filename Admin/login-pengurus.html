<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Pengurus | UKM Taekwondo Polije</title>
    <script>
      document.documentElement.classList.add("js");
    </script>
    <link rel="stylesheet" href="../../css/admin/login.css" />
  </head>

  <body>
    <main class="login-page">
      <section class="login-card" aria-labelledby="login-title">
        <h1 id="login-title">Login Pengurus</h1>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="username">Username / NIM</label>
            <input type="text" id="username" name="username" placeholder="Masukkan Username / NIM" autocomplete="username" aria-describedby="usernameError" />
            <p class="field-error" id="usernameError" role="alert"></p>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" placeholder="Masukkan Password" autocomplete="current-password" aria-describedby="passwordError" />
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Tampilkan password" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                  <circle cx="12" cy="12" r="3" />
                  <path class="slash" d="M4 4l16 16" />
                </svg>
              </button>
            </div>
            <p class="field-error" id="passwordError" role="alert"></p>
          </div>

          <p class="form-error" id="formError" role="alert"></p>

          <button type="submit" class="btn-login">Masuk</button>
        </form>

        <a href="/ukm-taekwondo-polije/Member/index.html" class="back-link">← Kembali Ke Beranda</a>
      </section>
    </main>

    <script src="../../js/admin/login.js"></script>
  </body>
</html>
