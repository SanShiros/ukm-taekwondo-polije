<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelola Konten</title>
  </head>
  <body>
    <header>
      <div>
        <img src="icon-seogi.png" alt="Logo SEOGI" />
        <span>SEOGI</span>
      </div>

      <div>
        <span>Dashboard Pengurus - UKM Taekwondo</span>
      </div>
      <div>
        <span>Pengurus</span>
        <button type="button">Keluar</button>
      </div>
    </header>
    <aside>
      <div>
        <img src="foto-baskara.jpg" alt="Foto Baskara" />
        <div>
          <p>Baskara</p>
          <p>Ketua Umum</p>
        </div>
      </div>

      <nav>
        <ul>
          <li><a href="#dashboard">Dashboard</a></li>
          <li><a href="#kelola-jadwal">Kelola Jadwal</a></li>
          <li><a href="#kelola-presensi">Kelola Presensi</a></li>
          <li><a href="#kelola-pendaftar">Kelola Pendaftar</a></li>
        </ul>
      </nav>
    </aside>
    <h1>Kelola Konten</h1>

    <form action="" method="post">
      <div>
        <label for="jenis_konten">Jenis Konten *</label><br />
        <select id="jenis_konten" name="jenis_konten" required>
          <option value="">Jenis Konten</option>
          <option value="prestasi">Prestasi</option>
        </select>
      </div>

      <br />

      <div>
        <label for="nama_kejuaraan">Nama Kejuaraan *</label><br />
        <input
          type="text"
          id="nama_kejuaraan"
          name="nama_kejuaraan"
          placeholder="Masukkan Nama Kejuaraan"
          required
        />
      </div>

      <br />

      <div>
        <label for="tahun">Tahun *</label><br />
        <input
          type="text"
          id="tahun"
          name="tahun"
          placeholder="YYYY"
          maxlength="4"
          required
        />
      </div>

      <br />

      <div>
        <label for="peringkat">Peringkat *</label><br />
        <input
          type="text"
          id="peringkat"
          name="peringkat"
          placeholder="Masukkan Juara"
          required
        />
      </div>

      <br />

      <div>
        <label for="keterangan">Keterangan</label><br />
        <textarea
          id="keterangan"
          name="keterangan"
          rows="5"
          cols="40"
          placeholder="Keterangan"
        ></textarea>
      </div>

      <br />

      <div>
        <p>Pesan Error akan muncul disini</p>
      </div>

      <br />

      <button type="submit">Simpan</button>
      <button type="reset">Batal</button>
    </form>
  </body>
</html>
