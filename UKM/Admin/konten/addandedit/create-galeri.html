<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelola Galeri</title>
  </head>
  <body>
    <header>
      <div>
        <img src="icon-seogi.png" alt="Logo SEOGI" />
        <span>SEOGI</span>
      </div>

      <div>
        <span>Dashboard Pengurus - UKM Taekwondo</span>
      </div>
      <div>
        <span>Pengurus</span>
        <button type="button">Keluar</button>
      </div>
    </header>
    <aside>
      <div>
        <img src="foto-baskara.jpg" alt="Foto Baskara" />
        <div>
          <p>Baskara</p>
          <p>Ketua Umum</p>
        </div>
      </div>

      <nav>
        <ul>
          <li><a href="#dashboard">Dashboard</a></li>
          <li><a href="#kelola-jadwal">Kelola Jadwal</a></li>
          <li><a href="#kelola-presensi">Kelola Presensi</a></li>
          <li><a href="#kelola-pendaftar">Kelola Pendaftar</a></li>
        </ul>
      </nav>
    </aside>
    <h1>Kelola Galeri</h1>

    <form action="" method="post" enctype="multipart/form-data">
      <h2>Unggah Foto</h2>

      <div>
        <img id="preview" src="" alt="Preview foto" width="400" height="200" />
      </div>

      <br />

      <div>
        <input
          type="file"
          id="foto"
          name="foto"
          accept=".jpg,.jpeg,.png"
          required
        />
        <br />
        <small>Format : JPG &amp; PNG</small>
      </div>

      <br />

      <div>
        <p>Pesan Error akan muncul disini</p>
      </div>

      <br />

      <button type="submit">Simpan</button>
      <button type="reset">Batal</button>
    </form>
  </body>
</html>
