<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pengurus SEOGI</title>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>SEOGI</h1>
        <h3>Dashboard Pengurus - UKM Taekwondo</h3>

        <p>Pengurus</p>
        <button type="button">Keluar</button>
    </header>

    <!-- Sidebar -->
    <aside>

        <!-- Profil Pengurus -->
        <section>
            <img src="baskara.jpg" alt="Foto Baskara" width="50">
            <h3>Baskara</h3>
            <p>Ketua Umum</p>
        </section>

        <!-- Menu Navigasi -->
        <nav>
            <ul>
                <li>
                    <a href="dashboard.html">Dashboard</a>
                </li>

                <li>
                    <a href="kelola-jadwal.html">Kelola Jadwal</a>
                </li>

                <li>
                    <a href="kelola-presensi.html">Kelola Presensi</a>
                </li>

                <li>
                    <a href="kelola-pendaftar.html">Kelola Pendaftar</a>
                </li>
            </ul>
        </nav>

    </aside>

    <!-- Konten Utama -->
    <main>

        <h2>Kelola Jadwal Latihan</h2>

        <button type="button">+ Tambah Jadwal</button>

        <!-- Tabel Jadwal -->
        <table border="1">

            <thead>
                <tr>
                    <th>Hari</th>
                    <th>Jam</th>
                    <th>Lokasi</th>
                    <th>Aksi</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Senin</td>
                    <td>19.00-20.00</td>
                    <td>Gor Perjuangan 45 Polije</td>
                    <td>
                        <button type="button">Edit</button>
                        <button type="button">Delete</button>
                    </td>
                </tr>

                <tr>
                    <td>Kamis</td>
                    <td>19.00-20.00</td>
                    <td>Gor Perjuangan 45 Polije</td>
                    <td>
                        <button type="button">Edit</button>
                        <button type="button">Delete</button>
                    </td>
                </tr>
            </tbody>

        </table>

    </main>

</body>
</html>
