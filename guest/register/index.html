<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pendaftaran Anggota Taekwondo</title>
    <link rel="stylesheet" href="/css/guest/register.css" />
  </head>
  <body>
    <main>
      <h2>Pendaftaran Anggota Baru</h2>

      <section class="register-flow">
        <h3>Alur Pendaftaran</h3>
        <ol>
          <li>Isi formulir dengan data benar</li>
          <li>Tekan tombol Kirim</li>
          <li>Lihat konfirmasi pendaftaran</li>
          <li>Tunggu proses dari pengurus</li>
        </ol>
      </section>

      <section class="register-form-section">
        <h3>Langkah Pendaftaran</h3>

        <div class="stepper">
          <div class="step">
            <span class="circle">1</span
            ><span class="step-label">Isi Formulir</span>
          </div>
          <span class="line"></span>
          <div class="step">
            <span class="circle">2</span><span class="step-label">Kirim</span>
          </div>
          <span class="line"></span>
          <div class="step">
            <span class="circle">3</span
            ><span class="step-label">Konfirmasi</span>
          </div>
        </div>

        <p class="form-note">Kolom bertanda * wajib diisi</p>

        <form class="register-form" action="#" method="post">
          <div class="form-group">
            <label for="full-name">Nama Lengkap *</label>
            <input
              type="text"
              id="full-name"
              name="full_name"
              placeholder="Nama Mahasiswa"
              required
            />
          </div>

          <div class="form-group">
            <label for="student-id">NIM *</label>
            <input
              type="text"
              id="student-id"
              name="student_id"
              placeholder="Masukkan NIM"
              required
            />
          </div>

          <div class="form-group">
            <label for="study-program">Jurusan / Program Studi *</label>
            <select id="study-program" name="study_program" required>
              <option value="">Pilih jurusan</option>
              <option value="informatics_engineering">
                Teknik Informatika
              </option>
              <option value="computer_engineering">Teknik Komputer</option>
              <option value="information_management">
                Manajemen Informatika
              </option>
              <option value="other">Lainnya</option>
            </select>
          </div>

          <div class="form-group">
            <label for="phone">Kontak (WhatsApp) *</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="08xxxxxxxxxx"
              required
            />
          </div>

          <p class="radio-title">Pengalaman Taekwondo *</p>
          <div class="radio-group">
            <div class="radio-item">
              <input
                type="radio"
                id="experience-beginner"
                name="experience"
                value="beginner"
                checked
              />
              <label for="experience-beginner"
                >Pemula (belum pernah berlatih)</label
              >
            </div>
            <div class="radio-item">
              <input
                type="radio"
                id="experience-experienced"
                name="experience"
                value="experienced"
              />
              <label for="experience-experienced">Pernah berlatih</label>
            </div>
          </div>

          <button type="submit" class="btn-primary">Kirim Pendaftaran</button>
          <button type="reset" class="btn-outline">Batal</button>
        </form>
      </section>
    </main>
  </body>
</html>
