<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pendaftaran Berhasil</title>
    <link rel="stylesheet" href="/css/guest/registersucces.css" />
  </head>
  <body>
    <div class="container">
      <div class="icon-success-wrapper">
        <div class="icon-success">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" overflow="visible">
            <defs>
              <mask id="circle-check-fill-k" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
                <rect width="24" height="24" fill="#fff" />
                <path d="M8 12.5L9.939 14.439A1.5 1.5 0 0 0 12.061 14.439L16 10.5" fill="none" stroke="#000" stroke-width="1.69" stroke-linecap="butt" stroke-linejoin="miter" />
              </mask>
              <mask id="circle-check-fill-o" maskUnits="userSpaceOnUse" x="-2" y="-2" width="28" height="28">
                <rect x="-2" y="-2" width="28" height="28" fill="#fff" />
                <path d="M21.5 12C21.5 17.247 17.247 21.5 12 21.5C6.753 21.5 2.5 17.247 2.5 12C2.5 6.753 6.753 2.5 12 2.5C17.247 2.5 21.5 6.753 21.5 12Z" fill="#000" />
              </mask>
            </defs>
            <path d="M21.5 12C21.5 17.247 17.247 21.5 12 21.5C6.753 21.5 2.5 17.247 2.5 12C2.5 6.753 6.753 2.5 12 2.5C17.247 2.5 21.5 6.753 21.5 12Z" fill="currentColor" stroke="currentColor" stroke-width="2.35" stroke-linecap="butt" stroke-linejoin="miter" mask="url(#circle-check-fill-k)" />
            <path d="M8 12.5L9.939 14.439A1.5 1.5 0 0 0 12.061 14.439L16 10.5" fill="none" stroke="currentColor" stroke-width="2.35" stroke-linecap="butt" stroke-linejoin="miter" mask="url(#circle-check-fill-o)" />
          </svg>
        </div>
      </div>

      <h1>Pendaftaran Berhasil Dikirim</h1>
      <p class="subtitle">Data kamu sudah tersimpan dan akan diproses oleh pengurus UKM.</p>

      <div class="card-info">
        <div class="card-header">
          <span class="user-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" overflow="visible">
              <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="miter">
                <path d="M16.4 7.6C16.4 10.03 14.43 12 12 12C9.57 12 7.6 10.03 7.6 7.6C7.6 5.17 9.57 3.2 12 3.2C14.43 3.2 16.4 5.17 16.4 7.6Z" />
                <path d="M3.75 21.35L3.75 20.383A1.65 1.65 0 0 1 4.233 19.217L7.117 16.333A1.65 1.65 0 0 1 8.283 15.85L15.717 15.85A1.65 1.65 0 0 1 16.883 16.333L19.767 19.217A1.65 1.65 0 0 1 20.25 20.383L20.25 21.35" />
              </g>
            </svg>
          </span>
          <span>Informasi Pendaftar</span>
        </div>
        <hr class="divider" />
        <div class="info-row">
          <span class="label">Nama</span>
          <span>:</span>
          <span class="value">[Nama pendaftar]</span>
        </div>
        <div class="info-row">
          <span class="label">NIM</span>
          <span>:</span>
          <span class="value">[NIM]</span>
        </div>
        <div class="info-row">
          <span class="label">Jurusan</span>
          <span>:</span>
          <span class="value">[Jurusan]</span>
        </div>
      </div>

      <div class="button-group">
        <a href="#" class="btn btn-primary">
          <span class="icon-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" overflow="visible">
              <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter">
                <path d="M14.149 4.671L19.649 8.949A3.5 3.5 0 0 1 21 11.712L21 17.5A3.5 3.5 0 0 1 17.5 21L6.5 21A3.5 3.5 0 0 1 3 17.5L3 11.712A3.5 3.5 0 0 1 4.351 8.949L9.851 4.671A3.5 3.5 0 0 1 14.149 4.671Z" />
                <path d="M14.5 15C14.5 16.381 13.381 17.5 12 17.5C10.619 17.5 9.5 16.381 9.5 15C9.5 13.619 10.619 12.5 12 12.5C13.381 12.5 14.5 13.619 14.5 15Z" />
              </g>
            </svg>
          </span>
          Kembali ke Beranda
        </a>
        <a href="#" class="btn btn-outline">
          <span class="icon-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" overflow="visible">
              <defs>
                <mask id="calendar-outline-c1" maskUnits="userSpaceOnUse" x="-2" y="-2" width="28" height="28">
                  <rect x="-2" y="-2" width="28" height="28" fill="#fff" />
                  <polygon points="5.38,8.88 2,8.88 1.63,11.13 3.13,11.13" fill="#000" />
                  <polygon points="18.63,11.13 22,11.13 22.38,8.88 20.88,8.88" fill="#000" />
                </mask>
              </defs>
              <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter">
                <path d="M7 5L17 5A3.5 3.5 0 0 1 20.5 8.5L20.5 17A3.5 3.5 0 0 1 17 20.5L7 20.5A3.5 3.5 0 0 1 3.5 17L3.5 8.5A3.5 3.5 0 0 1 7 5Z" />
                <path d="M3.5 10L20.5 10" mask="url(#calendar-outline-c1)" />
                <path d="M8 3L8 7" />
                <path d="M16 3L16 7" />
              </g>
            </svg>
          </span>
          Lihat Jadwal Latihan
        </a>
      </div>
    </div>
  </body>
</html>
